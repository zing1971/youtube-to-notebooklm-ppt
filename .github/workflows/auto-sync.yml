name: YouTube to NotebookLM Sync

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m patchright install chromium

      - name: Restore Auth State
        env:
          NOTEBOOKLM_AUTH_STATE: ${{ secrets.NOTEBOOKLM_AUTH_STATE }}
        run: |
          echo "$NOTEBOOKLM_AUTH_STATE" > auth_state.json

      - name: Run Sync Script
        run: python main.py

      - name: Commit state changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update processed videos state & auto-briefings"
          file_pattern: "processed_videos.json briefings/*"
