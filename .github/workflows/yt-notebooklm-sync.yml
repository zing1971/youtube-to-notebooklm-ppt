name: YouTube to NotebookLM Sync

on:
  schedule:
    # 每天 UTC 00:00 和 12:00 執行 (台灣時間早上 8 點與晚上 8 點)
    - cron: "0 0,12 * * *"
  workflow_dispatch: # 允許手動觸發

jobs:
  sync_and_archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 認證前置驗證：確認 Cookie/Auth JSON 與 GCP 憑證在執行主流程前皆有效 ──
      # 優先使用 NOTEBOOKLM_AUTH_JSON（新版 Playwright storage_state）
      # 若未設定則 fallback 至 NOTEBOOKLM_COOKIE（舊版 raw cookie 字串）
      - name: Validate credentials (pre-flight check)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_COOKIE: ${{ secrets.NOTEBOOKLM_COOKIE }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          python scripts/validate_auth.py

      # ── 主流程：偵測新影片並匯入 NotebookLM ─────────────────────────
      - name: Run YouTube to NotebookLM Sync
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_COOKIE: ${{ secrets.NOTEBOOKLM_COOKIE }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          python main.py

      # ── 歸檔：即使 main.py 失敗也嘗試清理過期產出物 ───────────────
      - name: Archive old Studio artifacts to Google Drive
        if: success() || failure()
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_COOKIE: ${{ secrets.NOTEBOOKLM_COOKIE }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          python archive_studio.py
